<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>poor.network</title>
<meta name="description" content="cam — network engineer">
<link rel="stylesheet" href="main.css">
</head>
<body>
  <main class="crt">
    <div class="window">
      <div class="titlebar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="title">guest@poor.network: ~</span>
      </div>
      <div class="body">
        <div id="terminal" class="terminal">
          <div class="line"><span class="prompt">guest@poor.network:~$ </span>whoami</div>
          <div class="line output">cam</div>
          <div class="line"><span class="prompt">guest@poor.network:~$ </span>cat bio.txt</div>
          <div class="line output">Network engineer. Info sec. Coffee.</div>
          <div class="line"><span class="prompt">guest@poor.network:~$ </span>curl -s ifconfig.me</div>
          <div class="line thanks">thanks for visiting 0.0.0.0!</div>
          <div class="line"><span class="prompt">guest@poor.network:~$ </span><span class="cursor">&#9608;</span></div>
        </div>
      </div>
    </div>
    <p class="footer">poor.network &mdash; running on whatever didn't break yet</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
